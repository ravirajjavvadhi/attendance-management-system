name: eduflow_student
description: "EduFlow Student Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.1.0
  dio: ^5.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^17.0.0
  lottie: ^3.0.0
  fl_chart: ^0.66.0
  cached_network_image: ^3.3.0
  local_auth: ^2.1.8 # For biometric login
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  mobile_scanner: ^3.5.5 # For QR Attendance (Future)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
